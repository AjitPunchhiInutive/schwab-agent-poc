name: Deploy Agent to Agent Platform

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'pyproject.toml'
      - 'Dockerfile'
  workflow_dispatch:

env:
  PROJECT_ID: schwab-agent-poc
  REGION: us-east4
  DISPLAY_NAME: runtime-validation-agent

jobs:

  deploy:
    name: "Deploy to Agent Platform → Agents → Deployments"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key for Private Module Access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id:                 ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install agents-cli
        run: uv tool install google-agents-cli

      - name: Install project dependencies
        run: agents-cli install

      - name: Show Deployment Plan
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Runtime Validation Agent — Deploy Plan"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Project       : ${{ env.PROJECT_ID }}"
          echo "  Region        : ${{ env.REGION }}"
          echo "  Agent         : ${{ env.DISPLAY_NAME }}"
          echo "  Agent Type    : SequentialAgent (deterministic)"
          echo "  Pipeline      : Authenticate → Fetch APM → Validate DB"
          echo "  Cloud SQL     : schwab-agent-poc:us-east4:apm-validation-db"
          echo "  VPC           : projects/schwab-agent-poc/global/networks/agent-vpc"
          echo "  SA            : sa-runtime-agent@schwab-agent-poc.iam.gserviceaccount.com"
          echo "  Triggered By  : ${{ github.actor }}"
          echo "  Run ID        : ${{ github.run_id }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Deploy to Agent Runtime
        run: |
          adk deploy agent_engine \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --display_name="${{ env.DISPLAY_NAME }}" \
            --env_file=.env \
            app

      - name: Show Agent Location
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Agent deployed to Agent Platform"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Find your agent at:"
          echo "    Agent Platform → Agents → Deployments"
          echo ""
          echo "    https://console.cloud.google.com/vertex-ai/agents/agent-engines?project=${{ env.PROJECT_ID }}"
          echo ""
          echo "  Test in Playground:"
          echo "    Click agent → Playground → Type:"
          echo "    'Validate APM for project ${{ env.PROJECT_ID }}'"
          echo ""
          echo "  View traces:"
          echo "    https://console.cloud.google.com/traces?project=${{ env.PROJECT_ID }}"
          echo ""
